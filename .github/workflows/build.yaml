name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.26.8'
  NDK_VERSION: r30
  # SHA-256 of the TENVPN release certificate; a release APK signed with anything else fails the build.
  RELEASE_CERT_SHA256: 69eca517c4025604296df64d58d098646ead1a888f8dc19554b82bab372f896d

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check core tag
        run: |
          version=$(yq -r '.core_version' build_config.yaml)
          git -C core/mihomo fetch --depth=1 origin "refs/tags/$version:refs/tags/$version"
          tagged=$(git -C core/mihomo rev-parse "$version^{commit}")
          pinned=$(git -C core/mihomo rev-parse HEAD)
          echo "core_version=$version tag=$tagged submodule=$pinned"
          test "$tagged" = "$pinned"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Vet core wrapper
        working-directory: core
        run: |
          CGO_ENABLED=0 go vet .
          CGO_ENABLED=0 go test .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get
          flutter analyze --no-fatal-infos

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [ checks ]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'ios' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: ios
            os: macos-26
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Android signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          args=(--env stable -v)
          case "${{ matrix.platform }}" in
            ios) args+=(--no-codesign) ;;
            windows) args+=(--arch "${{ matrix.arch }}") ;;
          esac
          dart setup.dart "${{ matrix.platform }}" "${args[@]}"
          ls -la dist
          test -n "$(ls -A dist)"

      - name: Verify APK signature
        if: matrix.platform == 'android'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for apk in dist/*.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
            echo "$apk $digest"
            test "$digest" = "$RELEASE_CERT_SHA256"
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { on = index($0, "[" v "]") > 0 || index($0, " " v) > 0; next }
            on { print }
          ' CHANGELOG.md > release.md
          cat .github/release_template.md >> release.md
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ./dist/*
          body_path: ./release.md
